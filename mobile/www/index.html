<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QureoCity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; color: #15130f;
        font-family: Inter, system-ui, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; text-align: center; padding: 24px; box-sizing: border-box; }
      button { font: inherit; padding: 10px 20px; border-radius: 999px; border: 1px solid #15130f22;
        background: #15130f; color: #fff; }
    </style>
  </head>
  <body>
    <!-- Only shown if the live site can't be reached (e.g. no internet). -->
    <main>
      <h1 style="margin:0;font-size:20px">Can't reach QureoCity</h1>
      <p style="margin:0;opacity:.6">Check your internet connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
